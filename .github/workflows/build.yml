name: Build Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Signing Key
        run: |
          keytool -genkey -v -keystore android/app/panpal-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias panpal -storepass panpal2024 -keypass panpal2024 \
            -dname "CN=PanPal, OU=Dev, O=PanPal, L=Shanghai, ST=Shanghai, C=CN"

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PanPal-v2.0.1-arm64-v8a.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanPal-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

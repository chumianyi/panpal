name: Build Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'
  GO_VERSION: '1.24.11'
  GOPEED_VERSION: 'v1.9.3'
  XMOBILE_VERSION: 'v0.0.0-20241108191957-fa514ef75a0f'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install gomobile
        run: |
          export GOTOOLCHAIN=go1.24.11
          go install golang.org/x/mobile/cmd/gomobile@${{ env.XMOBILE_VERSION }}
          go install golang.org/x/mobile/cmd/gobind@${{ env.XMOBILE_VERSION }}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Clone gopeed
        run: |
          git clone --depth 1 --branch ${{ env.GOPEED_VERSION }} https://github.com/GopeedLab/gopeed.git /tmp/gopeed

      - name: Build gopeed AAR
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export GOTOOLCHAIN=go1.24.11
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          mkdir -p /tmp/gopeed-bind
          cd /tmp/gopeed-bind
          printf 'module gopeed-bind\n\ngo 1.24.9\ntoolchain go1.24.11\n\nrequire github.com/GopeedLab/gopeed v1.9.3\nrequire golang.org/x/mobile v0.0.0-20241108191957-fa514ef75a0f\n' > go.mod
          go mod edit -replace github.com/GopeedLab/gopeed=/tmp/gopeed
          go mod download
          go mod tidy
          gomobile bind -tags nosqlite -ldflags="-w -s" -o /tmp/libgopeed.aar -target=android/arm64 -androidapi 21 -javapkg="com.gopeed" github.com/GopeedLab/gopeed/bind/mobile
          ls -la /tmp/libgopeed.aar

      - name: Copy gopeed AAR to project
        run: |
          cp /tmp/libgopeed.aar android/app/libs/libgopeed.aar
          ls -la android/app/libs/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Signing Key
        run: |
          keytool -genkey -v -keystore android/app/panpal-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias panpal -storepass panpal2024 -keypass panpal2024 \
            -dname "CN=PanPal, OU=Dev, O=PanPal, L=Shanghai, ST=Shanghai, C=CN"

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PanPal-v2.0.0-arm64-v8a.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanPal-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
